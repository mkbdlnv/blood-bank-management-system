name: QA Pipeline

on:
  push:
    branches:
      - qa
  pull_request:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      API_BASE_URL: http://127.0.0.1:5000
      FRONTEND_BASE_URL: http://127.0.0.1:5173
      MONGO_URI: mongodb://127.0.0.1:27017/bbms_qa
      JWT_SECRET: secret
      PORT: 5000
      QA_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      CI: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            qa/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install QA dependencies
        working-directory: qa
        run: npm ci

      - name: Install Playwright browser
        working-directory: qa
        run: npx playwright install --with-deps chromium

      - name: Seed admin user
        working-directory: backend
        run: node seedAdmin.js

      - name: Start backend
        working-directory: backend
        run: node server.js > ../backend.log 2>&1 &

      - name: Start frontend
        working-directory: frontend
        env:
          VITE_API_PROXY_TARGET: http://127.0.0.1:5000
        run: npm run dev -- --host 127.0.0.1 --port 5173 > ../frontend.log 2>&1 &

      - name: Wait for services
        working-directory: qa
        run: node ./scripts/wait-for-http.mjs http://127.0.0.1:5000/api/doc http://127.0.0.1:5173

      - name: Run API smoke tests
        working-directory: qa
        run: npm run test:api

      - name: Run UI smoke tests
        working-directory: qa
        run: npm run test:ui

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts
          path: |
            backend.log
            frontend.log
            qa/playwright-report
            qa/test-results
