name: Render Staging Deploy

on:
  workflow_run:
    workflows:
      - QA Pipeline
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'qa' }}
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Check Render deploy hook configuration
        id: hooks
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
          FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$BACKEND_HOOK" ] || [ -z "$FRONTEND_HOOK" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Render deploy hook secrets are not configured. Skipping staging deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger backend deploy
        if: steps.hooks.outputs.configured == 'true'
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error -X POST "$BACKEND_HOOK"

      - name: Trigger frontend deploy
        if: steps.hooks.outputs.configured == 'true'
        env:
          FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error -X POST "$FRONTEND_HOOK"
