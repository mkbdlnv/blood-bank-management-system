services:
  - name: bbms-backend-staging
    type: web
    runtime: docker
    plan: free
    branch: qa
    autoDeployTrigger: off
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  - name: bbms-frontend-staging
    type: web
    runtime: static
    plan: free
    branch: qa
    autoDeployTrigger: off
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
